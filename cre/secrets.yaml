# Maps the workflow-facing secret ID to the environment variable holding it.
#
# The Vault DON releases this directly into the attested enclave; it is never in node memory
# and never in this file. The `_VAR` suffix is not decoration: CRE CLI v1.1.0 fails to resolve
# a secret whose environment variable name is a substring of the secret name.
secretsNames:
  PLIMSOLL_HOLD_KEY:
    - PLIMSOLL_HOLD_KEY_VAR
