openapi: 3.0.3
info:
  title: plimsoll-survey
  version: 0.1.0
  description: |
    Service 2 of Plimsoll. A credit check that requires no disclosure.

    Request a confidential Survey of an agent at a Line, and read back the Mark. A Chainlink CRE
    Confidential Workflow reads the subject's private holdings inside an AWS Nitro enclave,
    values them at Chainlink prices after published haircuts, evaluates the Line, and emits a
    single boolean onchain.

    A Mark is a verdict and its provenance. It contains no balance, no price, no ratio, and no
    headroom. It is NOT a solvency oracle or a credit score: it attests that allowlisted sources
    bound to this subject, queried at time T with credentials the subject provisioned, reported
    holdings satisfying Line L.
servers:
  - url: https://plimsoll.vercel.app/api
    description: Must match the --endpoint passed to `baz gateway add`.

paths:
  /ladder/{subjectId}:
    get:
      operationId: getLadder
      summary: A subject's registered Line ladder.
      description: |
        The rungs a subject has consented to being asked about. The ladder IS the disclosure
        surface: a subject registering [100k, 250k, 500k, 1m] has consented to publishing about
        two bits to anyone willing to pay four times.
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Bytes32"}
      responses:
        "200":
          description: The ladder.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subjectId: {$ref: "#/components/schemas/Bytes32"}
                  ladder: {type: array, items: {$ref: "#/components/schemas/Line"}}

  /survey:
    post:
      operationId: requestSurvey
      summary: Request one confidential Survey. Paid.
      description: |
        Sends `requestSurvey()` onchain, which emits `SurveyRequested`. A CRE EVM Log trigger
        picks that up and runs the Survey inside the enclave. Returns immediately with a
        `surveyId`; poll `getMark`.

        Rate limited per (subject, requester) pair. This limit - not the fee - is the privacy
        mechanism: a few cents deters nobody from walking the ladder downward.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, lineId]
              properties:
                subjectId: {$ref: "#/components/schemas/Bytes32"}
                lineId: {type: integer, minimum: 0, description: Index into the subject's ladder.}
      responses:
        "202":
          description: Survey requested. Poll for the Mark.
          content:
            application/json:
              schema:
                type: object
                properties:
                  surveyId: {$ref: "#/components/schemas/Bytes32"}
                  txHash: {type: string}
                  explorer: {type: string}
                  poll: {type: string, description: Path of the getMark call for this Survey.}
                  pollAfterSeconds: {type: integer}
                  giveUpAfterSeconds: {type: integer}
        "400": {description: Malformed subjectId or lineId.}
        "502": {description: Onchain request failed - rate limited, unknown Line, or RPC failure.}

  /mark/{surveyId}:
    get:
      operationId: getMark
      summary: Retrieve the Mark for a Survey.
      description: |
        Returns 202 with `status: pending` while the enclave runs and the DON reaches consensus.
        Poll every 10 seconds. Give up after 120 seconds and treat the outcome as INDETERMINATE.
      parameters:
        - name: surveyId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Bytes32"}
      responses:
        "200":
          description: The Mark.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [settled]}
                  mark: {$ref: "#/components/schemas/Mark"}
        "202": {description: Still running.}
        "404": {description: Unknown surveyId.}

  /standing/{subjectId}:
    get:
      operationId: hasStanding
      summary: Does the subject hold an unbroken run of Marks?
      description: |
        What a counterparty actually underwrites against. Requires `k` distinct Surveys, all
        ABOVE at or above the threshold, spanning at least `window` seconds, with at least one
        still live. A single favourable Mark can be flash-funded; a run spanning a day cannot.
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Bytes32"}
        - name: thresholdUsd
          in: query
          required: true
          schema: {type: number}
          example: 250000
        - name: k
          in: query
          schema: {type: integer, default: 3}
        - name: window
          in: query
          schema: {type: integer, default: 86400}
      responses:
        "200":
          description: The standing verdict.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subjectId: {$ref: "#/components/schemas/Bytes32"}
                  thresholdUsd: {type: number}
                  k: {type: integer}
                  window: {type: integer}
                  standing: {type: boolean}

components:
  schemas:
    Bytes32:
      type: string
      pattern: "^0x[0-9a-fA-F]{64}$"

    Line:
      type: object
      description: One rung of a subject's ladder. A threshold predicate, never a balance.
      properties:
        lineId: {type: integer}
        metricId: {type: integer}
        metric: {type: string, enum: [observed_net_assets_usd, observed_liquid_usd]}
        comparator: {type: string, enum: [">="]}
        threshold: {type: string, description: USD at 1e8 fixed point.}
        thresholdUsd: {type: number}
        publishBelow: {type: boolean}

    Mark:
      type: object
      description: |
        The signed onchain attestation one Survey produces. Note what is absent: no balance, no
        per-asset amount, no price, no margin, no ratio, no headroom.
      properties:
        surveyId: {$ref: "#/components/schemas/Bytes32"}
        subjectId: {$ref: "#/components/schemas/Bytes32"}
        lineId: {type: integer}
        verdict:
          type: string
          enum: [INDETERMINATE, ABOVE, BELOW]
          description: |
            ABOVE - the named bound sources reported holdings satisfying the Line at `asOf`,
            after published haircuts. It does NOT mean the counterparty is solvent, unencumbered,
            or will remain so.
            BELOW - they did not.
            INDETERMINATE - no defensible answer was reached: a source was down, a price was
            stale, or the subject withheld consent for BELOW on this rung. It is not a soft yes.
        asOf: {type: integer, description: When the hold and prices were observed.}
        expiry: {type: integer, description: After which no consumer should honour this Mark.}
        expired: {type: boolean}
        sourceSetHash: {$ref: "#/components/schemas/Bytes32"}
        workflowId: {$ref: "#/components/schemas/Bytes32"}
